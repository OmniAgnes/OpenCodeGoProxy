name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o OpenCodeGoProxy.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: OpenCodeGoProxy-windows-amd64
          path: app/OpenCodeGoProxy.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/OpenCodeGoProxy.exe
